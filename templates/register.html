{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="card">
    <h2>注册账号</h2>
    <form method="post">
        <input name="username" placeholder="设置用户名" required>
        <input name="password" placeholder="设置密码" type="password" required>
        <button type="submit" class="btn">注册</button>
    </form>
    <p style="margin-top:12px;">已有账号？<a href="{{url_for('login')}}">去登录</a></p>
</div>
{% endblock %}
