<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AI 陪伴空间{% endblock %}</title>
<style>
    :root {
        --bg: #121218; --card: #1a1a22; --border: #2b2b3d;
        --text: #e6e3f0; --muted: #b8b5c9;
        --primary: #7b61b4; --primary-hover: #8f78c9; --danger: #c94f6d;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 15px; line-height: 1.6;
    }
    a { color: var(--primary-hover); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav {
        display: flex; align-items: center; gap: 18px;
        padding: 12px 24px; background: #16161e;
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 10;
    }
    .nav .brand { font-weight: 700; font-size: 17px; color: var(--primary-hover); margin-right: auto; }
    .nav a { color: var(--muted); font-size: 14px; }
    .nav a:hover { color: var(--text); text-decoration: none; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card {
        background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; padding: 20px 22px; margin-bottom: 16px;
    }
    .card h2, .card h4 { margin-top: 0; color: #fff; }
    input, textarea, select {
        width: 100%; background: #12121a; border: 1px solid var(--border);
        border-radius: 10px; color: var(--text); padding: 10px 12px;
        font-size: 15px; font-family: inherit; margin-bottom: 12px;
        outline: none; transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }
    ::placeholder { color: #6f6c80; }
    .btn {
        display: inline-block; background: var(--primary); color: #fff;
        border: none; border-radius: 10px; padding: 9px 18px;
        font-size: 14px; cursor: pointer; text-decoration: none;
        transition: background .2s; margin: 2px 4px 2px 0;
    }
    .btn:hover { background: var(--primary-hover); text-decoration: none; }
    .btn.del { background: var(--danger); }
    .btn.del:hover { background: #d9617d; }
    .flash-wrap { margin-bottom: 12px; }
    .flash {
        background: #2a2338; border-left: 4px solid var(--primary);
        color: var(--text); padding: 10px 14px; border-radius: 8px;
        margin-bottom: 8px; font-size: 14px;
    }
    .msg-box {
        max-height: 58vh; overflow-y: auto; padding: 12px;
        background: #12121a; border: 1px solid var(--border);
        border-radius: 12px; margin: 12px 0;
    }
    .user-msg, .ai-msg {
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 10px; padding: 10px 12px; border-radius: 10px;
        margin-bottom: 10px; white-space: pre-wrap; word-break: break-word;
    }
    .user-msg { background: #242436; border-left: 3px solid var(--primary); }
    .ai-msg { background: #1c2a24; border-left: 3px solid #4fae7a; }
    .user-msg .btn, .ai-msg .btn { padding: 3px 10px; font-size: 12px; flex-shrink: 0; }
</style>
</head>
<body>
<nav class="nav">
    <span class="brand">🤖 AI 陪伴空间</span>
    {% if session.get('user_id') %}
        <a href="{{ url_for('index') }}">首页</a>
        <a href="{{ url_for('community') }}">社区</a>
        <a href="{{ url_for('diary') }}">日记</a>
        <a href="{{ url_for('logout') }}">退出</a>
    {% else %}
        <a href="{{ url_for('login') }}">登录</a>
        <a href="{{ url_for('register') }}">注册</a>
    {% endif %}
</nav>
<div class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash-wrap">
            {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
